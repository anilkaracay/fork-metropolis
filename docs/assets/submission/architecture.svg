<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">FORK architecture and trust boundaries</title>
<desc id="desc">Privy supplies sign-in and a user-controlled embedded wallet. The wallet signs directly to two contracts on Monad Testnet: FORKRegistry, which holds authorship, parent links and reasoning hashes, and FORKBacking, which reads the lineage from the registry and holds backing, the split and claimable balances. Envio HyperIndex indexes the events of both contracts into one graph. The Next.js application verifies identity on the server, reads that graph, and keeps reasoning text, comments and Agree reactions in PostgreSQL.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#B1D6AC"/></marker></defs>
<rect width="1120" height="640" rx="20" fill="#0B0D10"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#F2F4F2">
<text x="48" y="56" font-size="26" font-weight="700">FORK: trust and data flow</text>
<text x="48" y="84" font-size="16" fill="#aab0b7">The user's wallet signs authorship and backing. Indexed events keep the lineage and the value that moved along it.</text>

