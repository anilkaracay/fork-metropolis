<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">FORK architecture and trust boundaries</title><desc id="desc">Privy identity and user-controlled wallet connect to the Next.js application. The server verifies identity and uses PostgreSQL. The wallet signs directly to Monad FORKRegistry. Envio indexes registry events and serves the graph to Next.js. Comments remain offchain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#B1D6AC"/></marker></defs>
<rect width="1120" height="620" rx="20" fill="#0B0D10"/>
<g font-family="Arial, sans-serif" fill="#F2F4F2"><text x="48" y="56" font-size="26" font-weight="700">FORK / trust and data flow</text><text x="48" y="84" font-size="16" fill="#aab0b7">User signatures establish authorship. Indexed events preserve lineage.</text>
<g fill="#12161B" stroke="#3a434b"><rect x="48" y="124" width="320" height="110" rx="12"/><rect x="48" y="324" width="320" height="110" rx="12"/><rect x="48" y="498" width="320" height="82" rx="12"/><rect x="692" y="124" width="380" height="110" rx="12"/><rect x="692" y="324" width="380" height="110" rx="12"/><rect x="692" y="498" width="380" height="82" rx="12"/></g>
<g font-size="21" font-weight="700"><text x="72" y="163">Privy + embedded EVM wallet</text><text x="72" y="363">FORK Next.js application</text><text x="72" y="533">Standard PostgreSQL</text><text x="716" y="163">FORKRegistry / Monad Testnet</text><text x="716" y="363">Envio HyperIndex</text><text x="716" y="533">Indexed social graph</text></g>
<g font-size="16" fill="#aab0b7"><text x="72" y="192">User-controlled approvals and signing</text><text x="72" y="393">Server verifies identity + wallet ownership</text><text x="72" y="560">Identity, metadata, Agree, comments</text><text x="716" y="192">Authorship, parent, metadata commitment</text><text x="716" y="393">Registry events and derived lineage</text><text x="716" y="560">Public read model consumed by the app</text></g>
