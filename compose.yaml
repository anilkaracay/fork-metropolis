name: fork-metropolis-dev

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: fork_dev
      POSTGRES_USER: fork_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "fork_dev",
          "-d",
          "fork_dev",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./.env.postgres.password

volumes:
  postgres_data:
