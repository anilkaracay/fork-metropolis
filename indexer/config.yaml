# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: fork-social-graph
description: Immutable FORK idea lineage and exact external-wallet participation.
address_format: lowercase
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: FORKRegistry
    abi_file_path: ./abi/FORKRegistry.json
    events:
      - event: ThesisCreated
      - event: ExecutionLinked
chains:
  - id: 10143
    start_block: ${ENVIO_FORK_START_BLOCK:-0}
    rpc: https://testnet-rpc.monad.xyz
    contracts:
      - name: FORKRegistry
        address: "${ENVIO_FORK_REGISTRY_ADDRESS:-0x0000000000000000000000000000000000000000}"
