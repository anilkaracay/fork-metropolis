name: fork-metropolis-prod

x-runtime: &runtime
  image: ${FORK_IMAGE:?Set the validated immutable FORK image tag}
  env_file: ./config/app.env
  networks: [private]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: fork_prod
      POSTGRES_USER: fork_prod
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, fork_prod, -d, fork_prod]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  migrate:
    <<: *runtime
    profiles: [operations]
    command: [node, /app/packages/db/src/migrate.ts]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging
  app:
    <<: *runtime
    ports: ["127.0.0.1:13000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2.0
    logging: *logging

secrets:
  postgres_password:
    file: ./config/postgres.password
volumes:
  postgres_data:
networks:
  private:
    driver: bridge
